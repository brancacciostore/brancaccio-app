<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brancaccio Store</title><style> *{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#27231f;font:15px system-ui}header{text-align:center;padding:24px;background:#fff}h1,h2,h3{font-family:Georgia;font-weight:normal}h1{letter-spacing:4px;margin:0}small{color:#806d53}nav{display:flex;justify-content:center;gap:10px;padding:12px;flex-wrap:wrap}button{background:#29241f;color:white;border:0;padding:12px 16px;border-radius:5px;font:inherit;cursor:pointer}button.alt{background:#e9dfd0;color:#29241f}main{max-width:850px;margin:auto;padding:18px}.hero{background:#e8dfd0;padding:35px 22px;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.card{background:white;padding:16px;border:1px solid #e5ded4;border-radius:8px;margin-bottom:12px}input,select{width:100%;padding:12px;border:1px solid #d4c9ba;border-radius:5px;font:inherit;margin:5px 0 12px;background:white}img{width:100%;height:180px;object-fit:cover}label{font-size:13px} .muted{color:#786e63} .line{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}footer{text-align:center;padding:24px;color:#786e63;font-size:12px}</style><header><small>BOUTIQUE · FASHION</small><h1>BRANCACCIO</h1><small>STORE</small></header><nav><button class="alt" onclick="view('shop')">Shop</button><button class="alt" onclick="view('looks')">Completi</button><button class="alt" onclick="view('cart')">Carrello</button><button onclick="view('admin')">Gestionale</button></nav><main id="main"></main><footer>BRANCACCIO STORE · Prototipo locale</footer><script>
let db;try{db=JSON.parse(localStorage.getItem('bs1'))||{products:[],orders:[],looks:[],cart:{}}}catch(e){db={products:[],orders:[],looks:[],cart:{}}}let page='shop';const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), euro=n=>Number(n).toLocaleString('it-IT',{style:'currency',currency:'EUR'});function save(){try{localStorage.setItem('bs1',JSON.stringify(db))}catch(e){alert('Memoria locale insufficiente: esporta i dati.')}}function view(p){page=p;render()}function add(id){let p=db.products.find(x=>x.id===id);if(!p||p.qty<=(db.cart[id]||0))return alert('Disponibilità esaurita');db.cart[id]=(db.cart[id]||0)+1;save();render()}function product(p){return `<div class="card">${p.photo?`<img src="${esc(p.photo)}">`:'<div style="height:100px;background:#eee6da;display:grid;place-items:center">BRANCACCIO</div>'}<h3>${esc(p.name)}</h3><p>${esc(p.size)} · ${esc(p.color)}</p><b>${euro(p.price)}</b><p class="muted">Disponibili: ${p.qty}</p><button onclick="add('${p.id}')" ${p.qty?'':'disabled'}>Aggiungi</button></div>`}function render(){let h='';if(page==='shop')h=`<div class="hero"><small>THE BOUTIQUE EDIT</small><h2>Il tuo stile, ogni giorno.</h2><p>Scopri la collezione Brancaccio Store</p></div><h2>Collezione</h2><div class="grid">${db.products.map(product).join('')||'Il catalogo è ancora vuoto. Aggiungi articoli dal gestionale.'}</div>`;if(page==='looks')h='<h2>Acquista il look</h2>'+ (db.looks.map(l=>`<div class="card"><h3>${esc(l.name)}</h3><div class="grid">${l.ids.map(id=>db.products.find(p=>p.id===id)).filter(Boolean).map(product).join('')}</div><button onclick="addLook('${l.id}')">Aggiungi completo</button></div>`).join('')||'Nessun completo creato.');if(page==='cart'){let rows=Object.entries(db.cart).map(([id,q])=>({p:db.products.find(x=>x.id===id),q})).filter(x=>x.p&&x.q);h='<h2>Carrello</h2>'+rows.map(({p,q})=>`<div class="card line">${esc(p.name)} · ${q} × ${euro(p.price)} <button class="alt" onclick="remove('${p.id}')">−</button></div>`).join('')+`<h3>Totale ${euro(rows.reduce((a,x)=>a+x.p.price*x.q,0))}</h3><button onclick="checkout()" ${rows.length?'':'disabled'}>Registra ordine di prova</button><p class="muted">Nessun pagamento reale.</p>`}if(page==='admin')h=`<h2>Gestionale</h2><div class="grid"><div class="card">Incassi registrati<h2>${euro(db.orders.filter(o=>o.status==='Vendita fisica').reduce((a,o)=>a+o.total,0))}</h2></div><div class="card">Ordini<h2>${db.orders.length}</h2></div><div class="card">Pezzi in magazzino<h2>${db.products.reduce((a,p)=>a+p.qty,0)}</h2></div></div><div class="card"><h2>Nuovo articolo</h2><form onsubmit="createProduct(event)"><label>Nome<input id="name" required></label><label>Taglia<input id="size"></label><label>Colore<input id="color"></label><label>Prezzo €<input id="price" type="number" min="0" step="0.01" required></label><label>Quantità<input id="qty" type="number" min="0" step="1" required></label><label>Codice a barre<input id="barcode"></label><label>Foto<input id="photo" type="file" accept="image/*"></label><button>Salva articolo</button></form></div><h2>Magazzino</h2>${db.products.map(p=>`<div class="card"><b>${esc(p.name)}</b><p>${esc(p.size)} · ${esc(p.color)} · ${euro(p.price)} · ${p.qty} pezzi</p><button class="alt" onclick="stock('${p.id}',1)">+1</button> <button class="alt" onclick="stock('${p.id}',-1)">−1</button> <button onclick="sale('${p.id}')">Vendi 1</button></div>`).join('')}<div class="card"><h2>Crea completo</h2><input id="lookname" placeholder="Nome del look">${db.products.map(p=>`<label style="display:block"><input style="width:auto" type="checkbox" name="look" value="${p.id}"> ${esc(p.name)} ${esc(p.size)}</label>`).join('')}<button onclick="makeLook()">Salva completo</button></div><h2>Ordini e spedizioni</h2>${db.orders.map(o=>`<div class="card"><b>${esc(o.id)} · ${euro(o.total)}</b><p>${esc(o.items.map(i=>i.name+' × '+i.q).join(', '))}</p><p>${esc(o.status)}</p>${o.status!=='Vendita fisica'?`<input id="t${o.id}" placeholder="Codice tracking" value="${esc(o.tracking||'')}"><button onclick="ship('${o.id}')">Segna spedito</button>`:''}</div>`).join('')||'Nessun ordine.'}<p><button class="alt" onclick="backup()">Esporta dati JSON</button></p><p class="muted">Demo locale senza autenticazione. Non inserire dati personali reali.</p>`;$('main').innerHTML=h}function remove(id){if(--db.cart[id]<=0)delete db.cart[id];save();render()}function stock(id,n){let p=db.products.find(x=>x.id===id);p.qty=Math.max(0,p.qty+n);save();render()}function sale(id){let p=db.products.find(x=>x.id===id);if(!p.qty)return alert('Esaurito');p.qty--;db.orders.unshift({id:Date.now().toString(),items:[{name:p.name,q:1}],total:p.price,status:'Vendita fisica'});save();render()}function checkout(){let items=Object.entries(db.cart).map(([id,q])=>({p:db.products.find(x=>x.id===id),q}));if(!items.length||items.some(x=>!x.p||x.p.qty<x.q))return alert('Controlla disponibilità');items.forEach(x=>x.p.qty-=x.q);db.orders.unshift({id:Date.now().toString(),items:items.map(x=>({name:x.p.name,q:x.q})),total:items.reduce((a,x)=>a+x.p.price*x.q,0),status:'Da spedire (prova)'});db.cart={};save();render();alert('Ordine di prova registrato')}function ship(id){let t=$('t'+id).value.trim();if(!t)return alert('Inserisci tracking');let o=db.orders.find(x=>x.id===id);o.tracking=t;o.status='Spedito';save();render()}function makeLook(){let name=$('lookname').value.trim(),ids=[...document.querySelectorAll('[name=look]:checked')].map(x=>x.value);if(!name||!ids.length)return alert('Inserisci nome e seleziona articoli');db.looks.push({id:Date.now().toString(),name,ids});save();render()}function addLook(id){let l=db.looks.find(x=>x.id===id);if(l.ids.some(id=>{let p=db.products.find(x=>x.id===id);return !p||p.qty<=(db.cart[id]||0)}))return alert('Completo non disponibile');l.ids.forEach(id=>db.cart[id]=(db.cart[id]||0)+1);save();view('cart')}async function createProduct(e){e.preventDefault();let p={id:Date.now().toString(),name:$('name').value,size:$('size').value,color:$('color').value,price:Number($('price').value),qty:Number($('qty').value),barcode:$('barcode').value,photo:''};let f=$('photo').files[0];if(f){try{p.photo=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,600/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.7))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(f)})}catch(e){return alert('Foto non supportata')}}db.products.push(p);save();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='brancaccio-backup.json';a.click()}render();</script></html>
